<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>KING ROP já fez o tereré dele hoje?</title>
  <meta name="description" content="Consulte o destino e descubra se KING ROP, o último gângster do mundo e do universo, já preparou o tereré de hoje.">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ropjafezoteras.org">
  <meta property="og:title" content="KING ROP já fez o tereré dele hoje?">
  <meta property="og:description" content="Guampa trincando de gelo ou seca no Texas? Clique para tirar a prova ao som de country texano.">
  <meta property="og:image" content="https://ropjafezoteras.org/assets/renan-sim.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell" data-state="idle">
    <header class="top-bar">
      <div class="lang-switch" role="group" aria-label="Idioma / Language / Idioma">
        <button type="button" class="lang-btn is-active" data-lang="pt-BR" aria-pressed="true">PT</button>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" class="lang-btn" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </header>

    <main class="stage" aria-live="polite">
      <figure class="portrait-frame" id="portraitFrame">
        <span class="tack tack-tl" aria-hidden="true"></span>
        <span class="tack tack-tr" aria-hidden="true"></span>
        <span class="tack tack-bl" aria-hidden="true"></span>
        <span class="tack tack-br" aria-hidden="true"></span>

        <div class="portrait-viewport">
          <img
            id="portraitImg"
            class="portrait-img"
            src="./assets/renan-base.jpg"
            alt="Retrato de KING ROP sentado em uma poltrona de couro na biblioteca"
            width="896"
            height="1200"
          >
          <div class="shuffle-veil" id="shuffleVeil" aria-hidden="true">
            <span class="shuffle-word" id="shuffleWord">Consultando a térmica...</span>
          </div>
        </div>

        <figcaption class="portrait-caption" id="portraitCaption">
          KING ROP, o último gângster do mundo e do universo. ☝🏻👊🏻👏🏻
        </figcaption>
      </figure>

      <section class="editorial">
        <h1 class="question-title" id="mainHeading">
          KING ROP já fez o tereré dele hoje? 🧉🤠
        </h1>

        <div class="verdict-box" id="verdictBox">
          <p class="verdict-stamp" id="verdictStamp" hidden></p>
          <p class="verdict-copy" id="verdictCopy">
            Será que a guampa já está trincando de gelo 🥶 ou hoje deu seca na fronteira 🌵? Aperte para tirar a prova e ligar o som do saloon.
          </p>
        </div>

        <div class="actions">
          <button type="button" class="draw-button" id="drawButton">
            Tirar a prova de hoje 🎲
          </button>
          <p class="tally" id="sessionTally" hidden></p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <section class="jukebox" id="jukeboxSection" aria-label="Vitrola texana">
        <div class="jukebox-now">
          <span class="vinyl-dot" id="vinylDot" aria-hidden="true"></span>
          <div class="jukebox-text">
            <span class="jukebox-title" id="trackStatus">🤠 Vitrola do Texas pronta</span>
            <label class="sr-only" id="trackSelectLabel" for="trackSelect">Escolher música texana</label>
            <select id="trackSelect" class="track-select"></select>
          </div>
        </div>

        <div class="jukebox-controls">
          <button type="button" class="jukebox-btn" id="playPauseBtn">
            Tocar música
          </button>
          <button type="button" class="jukebox-btn" id="nextTrackBtn">
            Próxima moda
          </button>
          <button type="button" class="jukebox-btn jukebox-btn-subtle" id="toggleVideoBtn" aria-expanded="false">
            Mostrar clipe
          </button>
          <a
            class="jukebox-btn jukebox-btn-subtle"
            href="https://open.spotify.com/playlist/3lwlAD79CzQpdY5ZoC8Xvj"
            target="_blank"
            rel="noopener noreferrer"
          >
            Spotify
          </a>
        </div>

        <div class="player-drawer" id="playerDrawer">
          <div id="ytPlayer"></div>
        </div>
      </section>

      <div class="colophon">
        <nav class="rop-socials" id="socialsNav" aria-label="Redes sociais do KING ROP">
          <span class="rop-socials-label" id="socialsLabel">Redes do KING ROP:</span>
          <a href="https://www.instagram.com/_renanpelicari/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            Instagram
          </a>
          <a href="https://www.linkedin.com/in/renanpelicari1/" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
            LinkedIn
          </a>
          <a href="https://x.com/_renanpelicari" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path></svg>
            X
          </a>
        </nav>

        <p class="author-credit">
          <span id="authorCreditPrefix">Feito com ❤️ por</span>
          <a href="https://x.com/jj_neno" target="_blank" rel="noopener noreferrer">@jj_neno</a>
        </p>
      </div>
    </footer>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
